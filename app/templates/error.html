<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ org }}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
           margin: 0; padding: 32px 20px; color: #111; background: #f6f6f6; }
    .card { max-width: 480px; margin: 40px auto; background: #fff; border-radius: 12px;
            padding: 28px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { line-height: 1.55; color: #333; }
  </style>
</head>
<body>
  <div class="card" role="main">
    <h1>{{ org }}</h1>
    <p>{{ message }}</p>
  </div>
</body>
</html>
