<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ org }} — add your card</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
           margin: 0; padding: 32px 20px; color: #111; background: #f6f6f6; }
    .card { max-width: 480px; margin: 40px auto; background: #fff; border-radius: 12px;
            padding: 28px; box-shadow: 0 1px 3px rgba(0,0,0,.12); text-align: center; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    dl { text-align: left; margin: 20px 0; }
    dt { color: #666; font-size: 13px; }
    dd { margin: 2px 0 12px; font-weight: 600; }
    /* Self-hosted button. The previous version hotlinked Google's badge image from
       developers.google.com, which stopped serving it - the browser fell back to
       alt text and rendered a broken image beside a bare link. */
    .btn { display: inline-block; margin-top: 8px; padding: 14px 24px;
           background: #202124; color: #fff; text-decoration: none;
           border-radius: 28px; font-size: 16px; font-weight: 600; }
    .btn:hover { background: #000; }
    .muted { color: #666; font-size: 13px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card" role="main">
    <h1>Your {{ org }} card</h1>
    <dl>
      <dt>Membership Number</dt><dd>{{ membership }}</dd>
      <dt>Status</dt><dd>{{ status }}</dd>
    </dl>
    <a class="btn" href="{{ save_link }}">Add to Google Wallet</a>
    <p class="muted">Tap the button to save the card to Google Wallet.</p>
  </div>
</body>
</html>
